
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TREAD | Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101a1b;
            font-family: 'Hanken Grotesk', system-ui, sans-serif;
            padding: 20px;
            color: #f5f1e9;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            background: #192526;
            border: 1px solid #344445;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand h1 {
            font-size: 38px;
            letter-spacing: 8px;
            color: #d6b88b;
        }

        .brand p {
            margin-top: 10px;
            color: #aab6b2;
            font-size: 12px;
            letter-spacing: 3px;
        }

        h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aab6b2;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            background: #101a1b;
            border: 1px solid #455656;
            border-radius: 7px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #d6b88b;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #d6b88b;
            color: #182223;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #ead3af;
        }

        .error {
            color: #ff9999;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #d6b88b;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="brand">
            <h1>TREAD</h1>
            <p>ADMINISTRATION</p>
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to manage your fashion store.</p>

        {% if form.errors %}
            <div class="error">
                Invalid login details or you don't have admin access.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Enter your username"
                required
            >

            <label for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">SIGN IN</button>
        </form>

        <div class="back">
            <a href="/">← Back to TREAD Store</a>
        </div>

    </div>

</body>
</html>
