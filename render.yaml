databases:
  - name: virtual-fashion-db
    databaseName: virtual_fashion_db
    user: virtual_fashion_user
    plan: free

services:
  - type: web
    name: virtual-fashion-store
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn virtual_fashion_store.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-fashion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.0"
